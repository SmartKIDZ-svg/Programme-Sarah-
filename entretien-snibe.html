<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entretien Snibe – Cartes d'apprentissage</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F6FB;--card:#fff;--ink:#16203A;--mute:#6B7389;--brand:#1F3A93;--brand2:#E8EDFA;--ok:#1E8E5A;--okbg:#E5F5EC;--ko:#C2410C;--kobg:#FDEDE3;--line:#E2E6F0}
*{box-sizing:border-box}html,body{margin:0}body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.wrap{max-width:680px;margin:0 auto;padding:16px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
h1{font-size:18px;margin:0;line-height:1.25}h1 small{display:block;font-size:12px;color:var(--mute);font-weight:500;margin-top:2px}
.lang{display:flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px;flex-shrink:0}
.lang button{border:0;background:none;padding:6px 12px;border-radius:999px;font:600 13px Inter,sans-serif;color:var(--mute);cursor:pointer}
.lang button.on{background:var(--brand);color:#fff}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 4px;font:600 13px Inter,sans-serif;color:var(--ink);cursor:pointer}
.tabs button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
select{flex:1;min-width:0;padding:9px 10px;border-radius:10px;border:1px solid var(--line);font:500 13px Inter,sans-serif;background:#fff;color:var(--ink)}
.chip{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;font:600 12px Inter,sans-serif;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--kobg);border-color:#F3C3A8;color:var(--ko)}
.prog{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:4px 0 6px}.prog i{display:block;height:100%;background:var(--ok);transition:width .3s}
.stats{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-bottom:12px}
.scene{perspective:1400px;min-height:340px}
.card{position:relative;width:100%;min-height:340px;transition:transform .5s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d;cursor:pointer}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border-radius:20px;border:1px solid var(--line);box-shadow:0 6px 24px rgba(22,32,58,.07);padding:22px;display:flex;flex-direction:column;overflow:auto}
.back{transform:rotateY(180deg)}
.tag{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--brand);background:var(--brand2);padding:4px 9px;border-radius:99px;align-self:flex-start;margin-bottom:14px}
.q{font-size:21px;font-weight:600;line-height:1.35;margin:auto 0}
.hint{font-size:12px;color:var(--mute);text-align:center;margin-top:16px}
.a{font-size:16px;line-height:1.6}
.trap{background:var(--kobg);color:var(--ko);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.5;margin-bottom:12px}
.trap b,.good b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.good{background:var(--okbg);color:#14532D;border-radius:12px;padding:10px 12px;font-size:15px;line-height:1.55}
.facts{font-size:16px;line-height:1.5}.facts li{margin-bottom:8px}
.act{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.act button{border:0;border-radius:14px;padding:14px;font:700 15px Inter,sans-serif;cursor:pointer}
.ko{background:var(--kobg);color:var(--ko)}.ok{background:var(--okbg);color:var(--ok)}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.nav button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font:600 13px Inter,sans-serif;cursor:pointer;color:var(--ink)}
.nav span{font-size:13px;color:var(--mute)}
.done{text-align:center;padding:40px 20px;background:#fff;border-radius:20px;border:1px solid var(--line)}
.done h2{margin:0 0 8px}.done p{color:var(--mute);margin:0 0 18px}
.done button{border:0;background:var(--brand);color:#fff;border-radius:12px;padding:12px 18px;font:600 14px Inter,sans-serif;cursor:pointer;margin:4px}
.reset{display:block;margin:22px auto 0;background:none;border:0;color:var(--mute);font:500 12px Inter,sans-serif;text-decoration:underline;cursor:pointer}
</style></head><body><div class="wrap">
<header><h1 id="title"></h1><div class="lang"><button data-l="fr">FR</button><button data-l="en">EN</button></div></header>
<div class="tabs"><button data-m="cards"></button><button data-m="traps"></button><button data-m="facts"></button></div>
<div class="bar"><select id="cat"></select><button class="chip" id="onlyko"></button><button class="chip" id="shuf">⤮</button></div>
<div class="prog"><i id="pbar"></i></div><div class="stats"><span id="s1"></span><span id="s2"></span></div>
<div id="stage"></div>
<button class="reset" id="reset"></button>
</div>
<script>
const DATA={"cards": [{"id": "cIntroduceyourselfinafewm", "cat": "1Présentatio", "q": {"fr": "Présentez-vous en quelques minutes.", "en": "Introduce yourself in a few minutes."}, "a": {"fr": "Je suis biologiste de formation, avec 9 ans d'expérience dans le diagnostic. Chez Cerba, j'ai dirigé l'agence de Sétif (150 clients sur 6 wilayas), puis géré au niveau central un portefeuille de plus de 1 100 laboratoires et médecins. Chez ALMED, distributeur d'Abbott Diagnostics, j'ai été technico-commerciale et superviseure des ventes. Aujourd'hui je gère 316 laboratoires sur 4 wilayas pour Cerba. Je veux mettre ce réseau au service d'un fabricant CLIA en forte croissance comme Snibe.", "en": "I am a biologist by training, with 9 years of experience in diagnostics. At Cerba, I managed the Sétif branch (150 customers across 6 wilayas), then a central portfolio of over 1,100 laboratories and doctors. At ALMED, the Abbott Diagnostics distributor, I was a technical sales representative and sales supervisor. Today I manage 316 laboratories across 4 wilayas for Cerba. I want to put this network at the service of a fast-growing CLIA manufacturer like Snibe."}}, {"id": "cWhatdidyoulearnfromyoure", "cat": "1Présentatio", "q": {"fr": "Que retenez-vous de votre expérience chez Cerba ?", "en": "What did you learn from your experience at Cerba?"}, "a": {"fr": "La relation de confiance avec les laboratoires : je les ai souvent dépannés pour des résultats très urgents, et ils me répondent au téléphone directement. J'ai aussi appris à gérer une agence, à coordonner des équipes sur 6 sites régionaux et à suivre un portefeuille de plus de 1 100 clients.", "en": "Building trust with laboratories: I often helped them get very urgent results, and they answer my calls directly. I also learned to run a branch, coordinate teams across 6 regional sites and manage a portfolio of over 1,100 customers."}}, {"id": "cAndatALMEDAbbottDiagnost", "cat": "1Présentatio", "q": {"fr": "Et chez ALMED (Abbott Diagnostics) ?", "en": "And at ALMED (Abbott Diagnostics)?"}, "a": {"fr": "J'ai travaillé côté distributeur d'un grand fabricant CLIA : prospection, prévisions de ventes et d'encaissements, veille concurrentielle, objectifs de livraison et reporting. Je connais donc de l'intérieur le fonctionnement d'un distributeur, ce qui est exactement le modèle de Snibe en Algérie.", "en": "I worked on the distributor side of a major CLIA manufacturer: prospecting, sales and collection forecasts, competitive monitoring, delivery targets and reporting. So I know from the inside how a distributor works, which is exactly Snibe's model in Algeria."}}, {"id": "cWhyareyouleavingyourcurr", "cat": "1Présentatio", "q": {"fr": "Pourquoi quittez-vous votre poste actuel ?", "en": "Why are you leaving your current position?"}, "a": {"fr": "J'ai rejoint Cerba en septembre 2026, et le poste se passe bien. Mais l'opportunité Snibe correspond exactement à mon projet : revenir à la vente de solutions CLIA, comme chez ALMED, avec un fabricant, plus de responsabilités et des objectifs chiffrés.", "en": "I joined Cerba in September 2026 and the job is going well. But the Snibe opportunity matches my career plan exactly: going back to selling CLIA solutions, as at ALMED, for a manufacturer, with more responsibility and clear targets."}}, {"id": "cWhathappenedbetweenJuly2", "cat": "1Présentatio", "q": {"fr": "Que s'est-il passé entre juillet 2024 et août 2026 ?", "en": "What happened between July 2024 and August 2026?"}, "a": {"fr": "J'ai travaillé en freelance en marketing digital et j'en ai profité pour me former : ISO 9001, ISO 15189 et gestion de projet. Cela m'a rendue plus autonome et m'a donné des outils utiles pour la prospection.", "en": "I worked as a freelancer in digital marketing and used that time to train: ISO 9001, ISO 15189 and project management. It made me more autonomous and gave me useful tools for prospecting."}}, {"id": "cWhydidyouleaveALMEDafter", "cat": "1Présentatio", "q": {"fr": "Pourquoi avez-vous quitté ALMED après peu de temps ?", "en": "Why did you leave ALMED after a short time?"}, "a": {"fr": "Je cherchais de meilleures opportunités de carrière et plus d'évolution professionnelle. J'ai beaucoup apprécié cette expérience, qui m'a surtout fait progresser en vente et en relation client.", "en": "I was looking for better career opportunities and more professional growth. I appreciated the experience; I gained a lot there, especially in sales and customer relationships."}}, {"id": "cWhatareyourmainstrengths", "cat": "1Présentatio", "q": {"fr": "Quels sont vos principaux points forts ?", "en": "What are your main strengths?"}, "a": {"fr": "Je sais communiquer, négocier et construire des relations clients solides. Je suis aussi organisée, motivée et orientée résultats.", "en": "I communicate, negotiate and build strong customer relationships. I am also organized, motivated and results-oriented."}}, {"id": "cWhyshouldwehireyou", "cat": "1Présentatio", "q": {"fr": "Pourquoi devrions-nous vous recruter ?", "en": "Why should we hire you?"}, "a": {"fr": "Parce que j'ai 9 ans d'expérience dans le diagnostic médical et une bonne connaissance du marché algérien. Je comprends les besoins des laboratoires et leurs volumes de tests. J'ai un réseau professionnel solide, avec un portefeuille de plus de 1 000 laboratoires en Algérie, et je peux mettre cette expérience au service du développement de Snibe.", "en": "I believe Snibe should hire me because I have nine years of experience in medical diagnostics and strong knowledge of the Algerian market. I understand laboratory needs and testing volumes. I have a strong professional network and a portfolio of more than 1,000 laboratories across Algeria. I believe I can use this experience to develop Snibe's business in Algeria."}}, {"id": "cHowisyourbiologybackgrou", "cat": "1Présentatio", "q": {"fr": "En quoi votre formation de biologiste est-elle un atout ?", "en": "How is your biology background an asset?"}, "a": {"fr": "Je parle le même langage que les biologistes : validation des résultats, contrôle qualité, ISO 15189. Je peux discuter performance analytique et menu de tests, pas seulement prix.", "en": "I speak the same language as biologists: result validation, quality control, ISO 15189. I can discuss analytical performance and test menu, not only price."}}, {"id": "cWhySnibe", "cat": "2Motivatione", "q": {"fr": "Pourquoi Snibe ?", "en": "Why Snibe?"}, "a": {"fr": "Parce que c'est une entreprise internationale avec un fort potentiel sur le marché du diagnostic médical. Snibe est spécialisé en chimiluminescence depuis 1995, a été le premier fabricant chinois de CLIA approuvé par la FDA et compte environ 40 000 installations dans plus de 160 pays. La gamme Maglumi couvre tous les laboratoires, du X3 au X8, avec un bon coût par test. C'est un produit que je peux défendre avec conviction. Ce poste est une bonne opportunité d'utiliser mon expérience, ma connaissance du marché algérien et mon réseau professionnel pour développer Snibe en Algérie.", "en": "Because it is an international company with strong potential in the medical diagnostics market. Snibe has specialized in chemiluminescence since 1995, was the first Chinese CLIA manufacturer cleared by the FDA, and has about 40,000 installations in over 160 countries. The Maglumi range fits every lab, from the X3 to the X8, with a good cost per test. It is a product I can defend with conviction. I believe this position is a good opportunity to use my experience, my knowledge of the Algerian market and my professional network to develop Snibe's business in Algeria."}}, {"id": "cWhatdoyouknowaboutourpro", "cat": "2Motivatione", "q": {"fr": "Que savez-vous de nos produits ?", "en": "What do you know about our products?"}, "a": {"fr": "La gamme Maglumi : le X3 compact pour les labos moyens, le X6 et le X8 pour les gros volumes, et le X10 lancé en 2025. Snibe propose aussi la biochimie, la biologie moléculaire, l'hémostase et l'automatisation complète (T8).", "en": "The Maglumi range: the compact X3 for mid-size labs, the X6 and X8 for high volumes, and the X10 launched in 2025. Snibe also offers biochemistry, molecular diagnostics, hemostasis and total lab automation (T8)."}}, {"id": "cWhatisCLIAandwhatisituse", "cat": "2Motivatione", "q": {"fr": "Qu'est-ce que la CLIA, et à quoi sert-elle ?", "en": "What is CLIA, and what is it used for?"}, "a": {"fr": "La CLIA (chimiluminescence) est une technologie qui utilise une réaction chimique pour produire de la lumière, mesurée par l'analyseur. Le CMIA est le nom donné par Abbott à sa chimiluminescence sur microparticules magnétiques ; le Maglumi utilise lui aussi des microbilles magnétiques, avec une chimiluminescence directe. Applications : hormones (TSH, T3, T4, prolactine, AMH, cortisol, LH), marqueurs tumoraux (CA 125, CA 19-9, NSE), cardiaques (troponine, BNP) et infectieux (HBsAg, VIH).", "en": "CLIA (chemiluminescence immunoassay) is a technology that uses a chemical reaction to produce light, which is measured by the analyzer. CMIA is Abbott's name for its chemiluminescent immunoassay on magnetic microparticles; Maglumi also uses magnetic microbeads, with direct chemiluminescence. Applications: hormones (TSH, T3, T4, prolactin, AMH, cortisol, LH), tumor markers (CA 125, CA 19-9, NSE), cardiac markers (troponin, BNP) and infectious diseases (HBsAg, HIV)."}}, {"id": "cInyourviewwhatareSnibess", "cat": "2Motivatione", "q": {"fr": "Quels sont, selon vous, les points forts et les points faibles de Snibe en Algérie ?", "en": "In your view, what are Snibe's strengths and weaknesses in Algeria?"}, "a": {"fr": "Points forts : coût par test compétitif, large menu, bonne qualité. Points faibles : une marque encore moins connue que Roche ou Abbott chez certains biologistes, et un service qui dépend de la réactivité du distributeur. Mon rôle est justement de rassurer par la preuve : démonstrations, références clients, suivi.", "en": "Strengths: competitive cost per test, broad menu, good quality. Weaknesses: a brand still less known than Roche or Abbott for some biologists, and service that depends on the distributor's responsiveness. My role is precisely to reassure with proof: demos, customer references, follow-up."}}, {"id": "cWhatmotivatesyouinthisro", "cat": "2Motivatione", "q": {"fr": "Qu'est-ce qui vous motive dans ce poste ?", "en": "What motivates you in this role?"}, "a": {"fr": "Le contact terrain, les objectifs chiffrés et le fait de faire grandir une marque. Gagner un laboratoire face à un leader installé, c'est ce qui me motive.", "en": "Field contact, measurable targets and growing a brand. Winning a lab against an established leader is what drives me."}}, {"id": "cHowwouldyoudescribetheCL", "cat": "3Marchéalgér", "q": {"fr": "Comment décririez-vous le marché CLIA en Algérie ?", "en": "How would you describe the CLIA market in Algeria?"}, "a": {"fr": "Deux marchés : le privé, où les biologistes décident vite sur la qualité, le service et le coût par test, et le public, qui achète par appels d'offres. Sur les appels d'offres de janvier à septembre 2026, le segment immuno-hormonologie représente environ 371 M DA, dominé par bioMérieux VIDAS via IMC (35 %). Snibe y est présent mais avec une marge de progression importante.", "en": "Two markets: the private sector, where biologists decide quickly on quality, service and cost per test, and the public sector, which buys through tenders. In public tenders from January to September 2026, the immunology/hormonology segment represents about 371 M DZD, led by bioMérieux VIDAS through IMC (35%). Snibe is present but with strong growth potential."}}, {"id": "cWhoareourmaincompetitors", "cat": "3Marchéalgér", "q": {"fr": "Qui sont nos principaux concurrents ?", "en": "Who are our main competitors?"}, "a": {"fr": "Roche (Cobas e), Abbott (Architect, Alinity), Siemens (Atellica), Beckman Coulter (Access, DxI), bioMérieux (VIDAS) dans le public, et Mindray, qui est le concurrent chinois le plus direct sur le prix.", "en": "Roche (Cobas e), Abbott (Architect, Alinity), Siemens (Atellica), Beckman Coulter (Access, DxI), bioMérieux (VIDAS) in the public sector, and Mindray, the most direct Chinese competitor on price."}}, {"id": "cHowwouldyoudevelopSnibes", "cat": "3Marchéalgér", "q": {"fr": "Comment développeriez-vous l'activité de Snibe en Algérie ?", "en": "How would you develop Snibe's business in Algeria?"}, "a": {"fr": "D'abord, je maîtrise les équipements Snibe : performances et cadences. Ensuite, j'identifie et je sélectionne les laboratoires à fort potentiel. J'écoute attentivement leurs besoins et je comprends leur situation : problèmes techniques, relations avec leurs fournisseurs actuels. Puis je propose une solution adaptée. Mon objectif : créer la confiance, construire des relations solides et faire grandir Snibe en Algérie.", "en": "First, I would learn about Snibe's equipment, performance and throughput capacity. Second, I would identify and select potential laboratories to visit. I would listen carefully to their needs and understand their current situation, including technical problems and relationships with other suppliers. Then I would propose suitable solutions based on their needs. My goal is to build trust, develop strong customer relationships and grow Snibe's business in Algeria."}}, {"id": "cHowdoyoubeatRocheorAbbot", "cat": "3Marchéalgér", "q": {"fr": "Comment battre Roche ou Abbott chez un client installé ?", "en": "How do you beat Roche or Abbott at an existing customer?"}, "a": {"fr": "Je ne critique jamais le concurrent. Je cible le moment du renouvellement, je calcule le coût par test réel du client, et je propose un essai ou une visite chez un laboratoire de référence équipé en Maglumi. La preuve convainc mieux que le discours. Je positionne Snibe comme une alternative compétitive : performance et fiabilité des équipements, disponibilité des réactifs, prix compétitif et support technique de qualité. Mon but : montrer que Snibe offre un bon rapport qualité-prix et des solutions fiables.", "en": "I never criticize the competitor. I target the renewal period, calculate the customer's real cost per test, and offer a trial or a visit to a reference lab using Maglumi. Proof convinces better than talk. I position Snibe as a competitive alternative in the Algerian market: performance and reliability of the equipment, reagent availability, competitive price and quality technical support. My goal is to show laboratories that Snibe offers good value for money and reliable solutions."}}, {"id": "cHowdoyouworkwiththepubli", "cat": "3Marchéalgér", "q": {"fr": "Comment travaillez-vous avec le secteur public ?", "en": "How do you work with the public sector?"}, "a": {"fr": "Je suis les appels d'offres publiés, je rencontre les chefs de service et les pharmaciens en amont pour que nos spécifications soient bien comprises, et je prépare avec le distributeur une offre conforme et compétitive.", "en": "I follow published tenders, meet department heads and pharmacists in advance so our specifications are well understood, and prepare a compliant and competitive offer with the distributor."}}, {"id": "cSnibesellsthroughdistrib", "cat": "4Travailavec", "q": {"fr": "Snibe vend via des distributeurs. Comment voyez-vous votre rôle avec eux ?", "en": "Snibe sells through distributors. How do you see your role with them?"}, "a": {"fr": "Je suis le lien entre Snibe et le distributeur. Je génère et qualifie les opportunités, j'accompagne leurs commerciaux chez les clients clés, je les forme sur les produits et je suis leurs stocks et leur service après-vente pour que le client soit toujours satisfait.", "en": "I am the link between Snibe and the distributor. I generate and qualify opportunities, support their sales reps at key customers, train them on products, and follow their stock and after-sales service so the customer is always satisfied."}}, {"id": "cWhatdoyoudoifthedistribu", "cat": "4Travailavec", "q": {"fr": "Que faites-vous si le distributeur n'est pas performant ?", "en": "What do you do if the distributor is not performing?"}, "a": {"fr": "D'abord je comprends la cause : stock, prix, priorités, compétences. Ensuite je fixe avec lui un plan d'action avec des objectifs mensuels et je fais un suivi régulier. Si rien ne change, je remonte l'information à ma hiérarchie avec des faits et des chiffres.", "en": "First I understand the cause: stock, pricing, priorities, skills. Then I agree an action plan with monthly targets and follow up regularly. If nothing changes, I escalate to my management with facts and figures."}}, {"id": "cHowdoyouhandleaconflictb", "cat": "4Travailavec", "q": {"fr": "Comment gérer un conflit entre deux distributeurs sur un même client ?", "en": "How do you handle a conflict between two distributors on the same customer?"}, "a": {"fr": "Je reste neutre et je m'appuie sur les règles fixées par Snibe : territoire, premier enregistrement de l'opportunité. L'objectif est de garder le client et la marque, pas de favoriser un distributeur.", "en": "I stay neutral and rely on Snibe's rules: territory, first registration of the opportunity. The goal is to keep the customer and the brand, not to favor one distributor."}}, {"id": "cDescribeyoursalesmethod", "cat": "5Venteetgest", "q": {"fr": "Décrivez votre méthode de vente.", "en": "Describe your sales method."}, "a": {"fr": "Je prépare la visite, j'écoute d'abord les besoins du laboratoire avec des questions ouvertes, je présente la solution adaptée avec des chiffres, puis je propose une étape concrète : démonstration, essai, ou rendez-vous avec le décideur. Je relance sous 48 heures.", "en": "I prepare the visit, first listen to the lab's needs with open questions, present the right solution with figures, then propose a concrete next step: demo, trial or meeting with the decision maker. I follow up within 48 hours."}}, {"id": "cTellusaboutadifficultsal", "cat": "5Venteetgest", "q": {"fr": "Racontez une vente difficile que vous avez réussie.", "en": "Tell us about a difficult sale you closed."}, "a": {"fr": "[Exemple personnel à préparer : le client, l'obstacle, ce que vous avez fait, le résultat chiffré.] Structurez en 4 temps : situation, objectif, action, résultat.", "en": "[Personal example to prepare: the customer, the obstacle, what you did, the measurable result.] Structure it in 4 steps: situation, task, action, result."}}, {"id": "cHowdoyouhandleadifficult", "cat": "5Venteetgest", "q": {"fr": "Comment gérez-vous un client difficile ou insatisfait ?", "en": "How do you handle a difficult or unsatisfied customer?"}, "a": {"fr": "J'écoute le client pour comprendre le problème, j'identifie la cause et je travaille avec l'équipe technique pour trouver une solution. Ma priorité : la satisfaction du client et le maintien d'une bonne relation. (Écouter → identifier → résoudre → garder la relation.)", "en": "I listen to the customer to understand the problem, then identify the cause and work with the technical team to find a solution. My priority is customer satisfaction and maintaining a good relationship. (Listen → identify → solve → maintain the relationship.)"}}, {"id": "cThecustomersaysyourprice", "cat": "5Venteetgest", "q": {"fr": "Le client dit que votre prix est trop élevé. Que faites-vous ?", "en": "The customer says your price is too high. What do you do?"}, "a": {"fr": "Je demande : « Cher par rapport à quoi ? ». Puis je parle de valeur : précision, stabilité des réactifs, service après-vente réactif et disponibilité des réactifs. Si c'est faisable avec le distributeur, je propose des facilités de paiement.", "en": "I ask: \"High compared to what?\" Then I talk about value: accuracy, reagent stability, responsive after-sales service and reagent availability. If feasible with the distributor, I offer payment plans."}}, {"id": "cHowdoyoucalculatecostper", "cat": "5Venteetgest", "q": {"fr": "Comment calculez-vous le coût par test ?", "en": "How do you calculate cost per test?"}, "a": {"fr": "Coût total (réactifs, calibrants, contrôles, consommables, maintenance, pertes) divisé par le nombre de résultats patients rendus. Les facteurs clés : stabilité à bord, taille des kits, fréquence de calibration et volume du laboratoire.", "en": "Total cost (reagents, calibrators, controls, consumables, maintenance, waste) divided by the number of reported patient results. Key factors: on-board stability, kit size, calibration frequency and lab volume."}}, {"id": "cHowdoyoubuildyourprospec", "cat": "5Venteetgest", "q": {"fr": "Comment construisez-vous votre liste de prospects ?", "en": "How do you build your prospect list?"}, "a": {"fr": "Je pars de ma base de plus de 1 100 contacts, dont les numéros personnels de propriétaires de laboratoires que je connais. Je qualifie chaque labo (automate actuel, volume, décideur, fin de contrat), j'ajoute les acheteurs publics grâce aux appels d'offres, puis je priorise par potentiel.", "en": "I start from my database of over 1,100 contacts, including the personal numbers of lab owners I know. I qualify each lab (current analyzer, volume, decision maker, contract end), add public buyers from tender data, then prioritize by potential."}}, {"id": "cHowmanyvisitsperdayandtr", "cat": "5Venteetgest", "q": {"fr": "Combien de visites par jour et de jours de déplacement par mois ?", "en": "How many visits per day and travel days per month?"}, "a": {"fr": "4 à 6 visites par jour dans ma ville, 3 à 4 en dehors. 14 à 16 jours par mois en ville, 6 à 8 en déplacement. Je regroupe les clients par zone et je me concentre sur ceux à fort potentiel.", "en": "4 to 6 visits per day in my city, 3 to 4 outside. 14 to 16 days per month in my city, 6 to 8 travelling. I group customers by area and focus on high-potential ones."}}, {"id": "cWhatwouldyoudoinyourfirs", "cat": "6Objectifsor", "q": {"fr": "Que feriez-vous dans vos 90 premiers jours ?", "en": "What would you do in your first 90 days?"}, "a": {"fr": "Mois 1 : formation produits, rencontre des distributeurs, cartographie du parc installé. Mois 2 : visites des comptes clés et des prospects prioritaires. Mois 3 : premières démonstrations et premières opportunités chiffrées dans le pipeline.", "en": "Month 1: product training, meeting distributors, mapping the installed base. Month 2: visiting key accounts and priority prospects. Month 3: first demos and first quantified opportunities in the pipeline."}}, {"id": "cHowdoyoutrackyouractivit", "cat": "6Objectifsor", "q": {"fr": "Comment suivez-vous votre activité ?", "en": "How do you track your activity?"}, "a": {"fr": "Avec un tableau de suivi : visites, opportunités, étape de chaque dossier, montant estimé et date de décision. J'envoie un reporting hebdomadaire clair à mon manager.", "en": "With a tracking sheet: visits, opportunities, stage of each deal, estimated value and decision date. I send a clear weekly report to my manager."}}, {"id": "cHowdoyouachieveyoursales", "cat": "6Objectifsor", "q": {"fr": "Comment atteignez-vous vos objectifs de vente ?", "en": "How do you achieve your sales targets?"}, "a": {"fr": "En 4 étapes : je priorise les clients à fort potentiel, j'identifie leurs besoins et les opportunités, je développe la relation et les propositions, et je fais un suivi régulier jusqu'à la décision.", "en": "In 4 steps: I prioritize high-potential customers, identify their needs and opportunities, develop the relationship and proposals, and follow up regularly until the decision."}}, {"id": "cHowdoyoureactifyoumissyo", "cat": "6Objectifsor", "q": {"fr": "Comment réagissez-vous si vous n'atteignez pas vos objectifs ?", "en": "How do you react if you miss your targets?"}, "a": {"fr": "J'analyse les raisons avec des chiffres, je les partage tôt avec mon manager et je propose un plan de rattrapage. Je préfère alerter tôt que surprendre à la fin du trimestre.", "en": "I analyze the reasons with figures, share them early with my manager and propose a recovery plan. I prefer to alert early rather than surprise at the end of the quarter."}}, {"id": "cAreyoucomfortableworking", "cat": "6Objectifsor", "q": {"fr": "Êtes-vous à l'aise pour travailler seule, sans bureau local ?", "en": "Are you comfortable working alone, without a local office?"}, "a": {"fr": "Oui. J'ai l'habitude de gérer mon planning, mes clients et mes priorités en autonomie. Je garde un contact régulier avec l'équipe par téléphone, WeChat ou e-mail.", "en": "Yes. I am used to managing my schedule, customers and priorities independently. I keep regular contact with the team by phone, WeChat or e-mail."}}, {"id": "cHowwillyouworkwithateamb", "cat": "7Culturedent", "q": {"fr": "Comment travaillerez-vous avec une équipe basée en Chine ?", "en": "How will you work with a team based in China?"}, "a": {"fr": "Avec des échanges réguliers, courts et factuels, en anglais. J'ai déjà échangé avec la responsable commerciale Algérie et j'apprécie leur approche orientée résultats. Je respecte les délais de reporting et je reste réactive malgré le décalage horaire.", "en": "With regular, short and factual exchanges in English. I have already spoken with the Algeria sales manager and I appreciate their results-driven approach. I respect reporting deadlines and stay responsive despite the time difference."}}, {"id": "cWhatisyourlevelofEnglish", "cat": "7Culturedent", "q": {"fr": "Quel est votre niveau d'anglais ?", "en": "What is your level of English?"}, "a": {"fr": "Je suis en cours de perfectionnement. Je comprends bien l'anglais technique du diagnostic et je peux échanger par écrit sans difficulté ; je continue à progresser à l'oral.", "en": "I am currently improving my English. I understand technical diagnostics English well and can communicate in writing without difficulty; I keep improving my speaking."}}, {"id": "cWhatareyourstrengthsanda", "cat": "7Culturedent", "q": {"fr": "Quelles sont vos qualités et votre point d'amélioration ?", "en": "What are your strengths and an area for improvement?"}, "a": {"fr": "Qualités : relationnel solide, empathie avec les biologistes, autonomie, connaissance fine du terrain de l'Est à l'Ouest. Point d'amélioration : j'ai tendance à vouloir tout suivre moi-même ; j'apprends à m'appuyer davantage sur les équipes des distributeurs.", "en": "Strengths: strong relationships, empathy with biologists, autonomy, deep field knowledge from East to West. Area for improvement: I tend to want to follow everything myself; I am learning to rely more on distributor teams."}}, {"id": "cWheredoyouseeyourselfin3", "cat": "7Culturedent", "q": {"fr": "Où vous voyez-vous dans 3 à 5 ans ?", "en": "Where do you see yourself in 3 to 5 years?"}, "a": {"fr": "En ayant fait de Snibe un acteur de premier plan en Algérie, et en évoluant vers un poste de Key Account Manager senior ou de responsable pays.", "en": "Having made Snibe a leading player in Algeria, and growing into a senior Key Account Manager or country manager role."}}, {"id": "cWhencanyoustart", "cat": "8Disponibili", "q": {"fr": "Quand pouvez-vous commencer ?", "en": "When can you start?"}, "a": {"fr": "Après mon préavis de [X semaines]. Je peux m'organiser pour suivre une formation produits avant ma date d'entrée si besoin.", "en": "After my notice period of [X weeks]. I can arrange to attend product training before my start date if needed."}}, {"id": "cAreyouwillingtotravelinc", "cat": "8Disponibili", "q": {"fr": "Êtes-vous prête à voyager, y compris à l'étranger pour des formations ?", "en": "Are you willing to travel, including abroad for training?"}, "a": {"fr": "Oui, sans problème, en Algérie comme à l'étranger.", "en": "Yes, without any problem, both in Algeria and abroad."}}, {"id": "cWhatareyoursalaryexpecta", "cat": "8Disponibili", "q": {"fr": "Quelles sont vos prétentions salariales ?", "en": "What are your salary expectations?"}, "a": {"fr": "Avant de parler de mes prétentions, j'aimerais comprendre le périmètre du poste, la zone géographique et la fréquence des déplacements hors d'Alger. Cela me permettra de vous donner une attente juste et réaliste. (Si on insiste : 2 000 € pendant l'essai, 2 500 € après confirmation.)", "en": "Before discussing my salary expectations, I would like to understand the scope of the position, the geographical area and the frequency of travel outside Algiers. This will help me give you a fair and realistic salary expectation. (If pressed: €2,000 during the trial, €2,500 after confirmation.)"}}], "traps": [{"id": "t0", "q": {"fr": "Vous êtes chez Cerba depuis septembre seulement. Pourquoi partir déjà ?", "en": "You have only been at Cerba since September. Why leave already?"}, "trap": {"fr": "Donner l'impression d'être instable ou de critiquer Cerba.", "en": "Looking unstable or criticizing Cerba."}, "a": {"fr": "Le poste chez Cerba se passe bien, mais Snibe correspond exactement à mon projet : revenir à la vente de solutions CLIA, comme chez ALMED, avec un fabricant. C'est un choix de carrière, pas une fuite.", "en": "The job at Cerba is going well, but Snibe matches my career plan exactly: going back to selling CLIA solutions, as at ALMED, for a manufacturer. It is a career choice, not an escape."}}, {"id": "t1", "q": {"fr": "Quel est votre salaire actuel ?", "en": "What is your current salary?"}, "trap": {"fr": "Donner le chiffre tout de suite : l'offre sera calée dessus (environ 880 $).", "en": "Giving the figure right away: the offer will be based on it (about $880)."}, "a": {"fr": "Mon poste actuel est local, avec une grille d'entreprise algérienne, et je l'ai repris récemment. Le poste chez Snibe est différent : fabricant, objectifs, déplacements, distributeurs. Mes attentes sont basées sur ce poste et sur le marché. (Si on insiste : donner le chiffre, sans mentir.)", "en": "My current role is local, with an Algerian company pay scale, and I took it recently. The Snibe role is different: manufacturer, targets, travel, distributors. My expectations are based on this role and the market. (If pressed: give the figure, without lying.)"}}, {"id": "t2", "q": {"fr": "Si on vous propose 1 000 €, vous acceptez ?", "en": "If we offer you €1,000, do you accept?"}, "trap": {"fr": "Dire oui par peur de perdre le poste, ou refuser sèchement.", "en": "Saying yes out of fear of losing the job, or refusing bluntly."}, "a": {"fr": "Merci, mais c'est en dessous de ce qui se pratique pour ce type de poste. Compte tenu de ce que je peux apporter dès les premiers mois, pouvons-nous revoir le fixe à 1 800 € pendant l'essai, avec une révision écrite à 2 400 € après ?", "en": "Thank you, but it is below what is usual for this type of position. Considering what I can deliver from the first months, could we review the base to €1,800 during the trial, with a written review to €2,400 after?"}}, {"id": "t3", "q": {"fr": "Savez-vous combien gagnait la personne avant vous ?", "en": "Do you know how much your predecessor earned?"}, "trap": {"fr": "Dire « oui, 1 800 € puis 2 400 € » : cela révèle une information confidentielle.", "en": "Saying \"yes, €1,800 then €2,400\": it reveals confidential information."}, "a": {"fr": "Je ne connais pas les conditions internes. Je sais seulement que, sur le marché, un KAM chez un fabricant international en Algérie se situe autour de 1 800 à 2 500 €.", "en": "I do not know your internal terms. I only know that, on the market, a KAM with an international manufacturer in Algeria is around €1,800 to €2,500."}}, {"id": "t4", "q": {"fr": "Snibe est une marque chinoise. Les biologistes n'ont pas confiance, non ?", "en": "Snibe is a Chinese brand. Biologists don't trust it, do they?"}, "trap": {"fr": "Être d'accord, ou s'énerver.", "en": "Agreeing, or getting defensive."}, "a": {"fr": "Certains hésitent au début, c'est vrai. Mais Snibe est le premier fabricant chinois de CLIA approuvé par la FDA, avec environ 40 000 installations dans plus de 160 pays. Je rassure par la preuve : essai, visite d'un labo de référence, comparaison de résultats.", "en": "Some hesitate at first, it is true. But Snibe is the first Chinese CLIA manufacturer cleared by the FDA, with about 40,000 installations in over 160 countries. I reassure with proof: a trial, a visit to a reference lab, a results comparison."}}, {"id": "t5", "q": {"fr": "Pourquoi deux ans en freelance ? Vous ne trouviez pas de poste ?", "en": "Why two years as a freelancer? Couldn't you find a job?"}, "trap": {"fr": "Se justifier longuement ou paraître sur la défensive.", "en": "Over-justifying or sounding defensive."}, "a": {"fr": "C'était un choix : j'ai travaillé en marketing digital et je me suis formée (ISO 9001, ISO 15189, gestion de projet). Cela m'a rendue plus autonome. Je suis ensuite revenue au diagnostic, mon vrai métier.", "en": "It was a choice: I worked in digital marketing and trained (ISO 9001, ISO 15189, project management). It made me more autonomous. Then I came back to diagnostics, my real field."}}, {"id": "t6", "q": {"fr": "Pourquoi avez-vous quitté ALMED ?", "en": "Why did you leave ALMED?"}, "trap": {"fr": "Critiquer ALMED ou Abbott.", "en": "Criticizing ALMED or Abbott."}, "a": {"fr": "Je cherchais de meilleures opportunités de carrière et plus d'évolution. Cette expérience m'a appris le fonctionnement d'un distributeur CLIA, ce qui est directement utile chez Snibe.", "en": "I was looking for better career opportunities and more professional growth. This experience taught me how a CLIA distributor works, which is directly useful at Snibe."}}, {"id": "t7", "q": {"fr": "Votre anglais n'est pas parfait. Comment travaillerez-vous avec la Chine ?", "en": "Your English is not perfect. How will you work with China?"}, "trap": {"fr": "Prétendre être bilingue, ou s'excuser.", "en": "Claiming to be bilingual, or apologizing."}, "a": {"fr": "Je comprends bien l'anglais technique et j'écris sans difficulté. Je progresse à l'oral et je continue à me former. Nos échanges sont surtout écrits et factuels, et je suis toujours réactive.", "en": "I understand technical English well and write without difficulty. I am improving my speaking and keep training. Our exchanges are mostly written and factual, and I am always responsive."}}, {"id": "t8", "q": {"fr": "Vos contacts viennent de Cerba. Ce n'est pas un problème de les utiliser ?", "en": "Your contacts come from Cerba. Isn't it a problem to use them?"}, "trap": {"fr": "Laisser penser qu'elle emporte une base de données de l'entreprise.", "en": "Suggesting she takes a company database with her."}, "a": {"fr": "Ce sont des relations personnelles construites sur des années : les biologistes me connaissent, moi. Je ne prends aucun fichier ni aucune donnée de mes anciens employeurs.", "en": "These are personal relationships built over years: biologists know me personally. I take no files or data from my former employers."}}, {"id": "t9", "q": {"fr": "Pourquoi vous plutôt qu'un candidat qui a déjà vendu des automates ?", "en": "Why you rather than a candidate who has already sold analyzers?"}, "trap": {"fr": "Se dévaloriser.", "en": "Underselling herself."}, "a": {"fr": "J'ai vendu côté distributeur Abbott chez ALMED, je suis biologiste et je connais personnellement des centaines de laboratoires. Je parle leur langage et j'ai déjà leur confiance : c'est ce qui fait gagner du temps sur le terrain.", "en": "I sold on the Abbott distributor side at ALMED, I am a biologist and I personally know hundreds of laboratories. I speak their language and already have their trust: that saves time in the field."}}, {"id": "t10", "q": {"fr": "Combien de Maglumi pouvez-vous vendre la première année ?", "en": "How many Maglumi can you sell in the first year?"}, "trap": {"fr": "Lancer un chiffre au hasard pour impressionner.", "en": "Throwing out a random number to impress."}, "a": {"fr": "Je préfère m'engager sur un chiffre après avoir cartographié le parc installé et les renouvellements. Ce que je peux promettre : des démonstrations dès le 3e mois et un pipeline chiffré suivi chaque semaine. L'objectif, je le fixerai avec vous.", "en": "I prefer to commit to a figure after mapping the installed base and renewals. What I can promise: demos from month 3 and a quantified pipeline tracked weekly. We will set the target together."}}, {"id": "t11", "q": {"fr": "Que pensez-vous de Mindray ?", "en": "What do you think of Mindray?"}, "trap": {"fr": "Dénigrer le concurrent.", "en": "Badmouthing the competitor."}, "a": {"fr": "C'est un concurrent sérieux, très présent en Algérie avec SADID. Je ne critique pas : je compare sur des faits, comme le coût par test, le menu et le service.", "en": "It is a serious competitor, very present in Algeria with SADID. I do not criticize: I compare on facts such as cost per test, menu and service."}}, {"id": "t12", "q": {"fr": "Le client veut une remise que le distributeur refuse. Que faites-vous ?", "en": "The customer wants a discount the distributor refuses. What do you do?"}, "trap": {"fr": "Promettre la remise au client sans accord.", "en": "Promising the discount without approval."}, "a": {"fr": "Je ne promets rien sans accord. Je cherche avec le distributeur une autre contrepartie (formation, délai de paiement, calibrants), et si l'enjeu est important je remonte à ma hiérarchie avec les chiffres.", "en": "I promise nothing without approval. I look with the distributor for another trade-off (training, payment terms, calibrators), and if the stake is high I escalate to my management with figures."}}, {"id": "t13", "q": {"fr": "Quel est votre plus grand échec ?", "en": "What is your biggest failure?"}, "trap": {"fr": "Dire « je n'en ai pas », ou raconter un échec grave sans leçon.", "en": "Saying \"I have none\", or telling a serious failure with no lesson."}, "a": {"fr": "[Un exemple réel, petit.] Ce que j'ai appris, et ce que je fais différemment maintenant.", "en": "[A real, small example.] What I learned, and what I do differently now."}}], "facts": [{"id": "f0", "q": {"fr": "Snibe en bref", "en": "Snibe in brief"}, "a": {"fr": "Fondé en 1995 à Shenzhen · spécialiste de la chimiluminescence · 1er fabricant chinois de CLIA approuvé par la FDA · environ 40 000 installations · plus de 160 pays", "en": "Founded in 1995 in Shenzhen · chemiluminescence specialist · 1st Chinese CLIA manufacturer cleared by the FDA · about 40,000 installations · over 160 countries"}}, {"id": "f1", "q": {"fr": "Gamme Maglumi", "en": "Maglumi range"}, "a": {"fr": "X3 : compact, 200 tests/h · X6 et X8 : gros volumes, X8 jusqu'à 600 tests/h (2 400 avec 4 modules) · X10 lancé en 2025 · T8 : automatisation complète", "en": "X3: compact, 200 tests/h · X6 and X8: high volume, X8 up to 600 tests/h (2,400 with 4 modules) · X10 launched in 2025 · T8: total lab automation"}}, {"id": "f2", "q": {"fr": "Distributeurs Snibe en Algérie", "en": "Snibe distributors in Algeria"}, "a": {"fr": "SADID Diagnopharm (historique, aussi Mindray) · Elena Diagnostics (1re installation T8 en Algérie)", "en": "SADID Diagnopharm (historical, also Mindray) · Elena Diagnostics (1st T8 installation in Algeria)"}}, {"id": "f3", "q": {"fr": "Concurrents et distributeurs", "en": "Competitors and distributors"}, "a": {"fr": "Roche : Dimed, Hydrapharm · Abbott : ALMED · Siemens : filiale + Lapropharm Plus · Beckman : Algérie Santé, aujourd'hui Vicralys · bioMérieux : IMC · Mindray : SADID", "en": "Roche: Dimed, Hydrapharm · Abbott: ALMED · Siemens: subsidiary + Lapropharm Plus · Beckman: Algérie Santé, now Vicralys · bioMérieux: IMC · Mindray: SADID"}}, {"id": "f4", "q": {"fr": "Appels d'offres labo (janv.–sept. 2026)", "en": "Lab tenders (Jan–Sep 2026)"}, "a": {"fr": "746 lots · 5,5 milliards DA · 230 hôpitaux publics · marché très éclaté : aucun distributeur au-dessus de 7 %", "en": "746 lots · 5.5 bn DZD · 230 public hospitals · very fragmented market: no distributor above 7%"}}, {"id": "f5", "q": {"fr": "Immuno-hormonologie (janv.–sept. 2026)", "en": "Immunology/hormonology (Jan–Sep 2026)"}, "a": {"fr": "Environ 371 M DA · leader : bioMérieux VIDAS via IMC (35 %) · Snibe : 5 lots, environ 22 M DA · Roche Cobas e411 : 4 lots, environ 28 M DA", "en": "About 371 M DZD · leader: bioMérieux VIDAS through IMC (35%) · Snibe: 5 lots, about 22 M DZD · Roche Cobas e411: 4 lots, about 28 M DZD"}}, {"id": "f6", "q": {"fr": "Parcours de Sarah", "en": "Sarah's background"}, "a": {"fr": "Biologiste (Master 2) · 9 ans · Cerba Sétif : 150 clients, 6 wilayas · Cerba central : 1 100+ clients · ALMED (Abbott) : technico-commerciale · Cerba aujourd'hui : 316 labos, 4 wilayas", "en": "Biologist (Master's) · 9 years · Cerba Sétif: 150 customers, 6 wilayas · Cerba central: 1,100+ customers · ALMED (Abbott): technical sales · Cerba today: 316 labs, 4 wilayas"}}, {"id": "f7", "q": {"fr": "Salaire : repères", "en": "Salary benchmarks"}, "a": {"fr": "Demander : 2 000 € (essai) puis 2 500 € · Minimum : 1 800 € puis 2 400 € · Indemnités : 50 €/jour hors résidence, 100 €/nuitée · 1 € ≈ 152 DA (officiel)", "en": "Ask: €2,000 (trial) then €2,500 · Minimum: €1,800 then €2,400 · Allowances: €50/day away, €100/night · €1 ≈ 152 DZD (official)"}}, {"id": "f8", "q": {"fr": "Coût par test", "en": "Cost per test"}, "a": {"fr": "Coût total (réactifs, calibrants, contrôles, consommables, maintenance, pertes) ÷ résultats patients rendus", "en": "Total cost (reagents, calibrators, controls, consumables, maintenance, waste) ÷ reported patient results"}}, {"id": "f9", "q": {"fr": "Rythme de visites", "en": "Visit rhythm"}, "a": {"fr": "4 à 6 visites/jour en ville, 3 à 4 hors ville · 14 à 16 jours en ville, 6 à 8 en déplacement par mois · clients clés toutes les 2 semaines", "en": "4 to 6 visits/day in town, 3 to 4 outside · 14 to 16 days in town, 6 to 8 travelling per month · key accounts every 2 weeks"}}], "catnames": {"1Présentatio": {"fr": "Présentation et parcours", "en": "Introduction and background"}, "2Motivatione": {"fr": "Motivation et connaissance de Snibe", "en": "Motivation and knowledge of Snibe"}, "3Marchéalgér": {"fr": "Marché algérien", "en": "Algerian market"}, "4Travailavec": {"fr": "Travail avec les distributeurs", "en": "Working with distributors"}, "5Venteetgest": {"fr": "Vente et gestion des clients", "en": "Sales and account management"}, "6Objectifsor": {"fr": "Objectifs, organisation et résultats", "en": "Targets, organization and results"}, "7Culturedent": {"fr": "Culture d'entreprise et communication", "en": "Company culture and communication"}, "8Disponibili": {"fr": "Disponibilité et conditions", "en": "Availability and conditions"}}};
const T={fr:{title:"Entretien Snibe",sub:"Sales Consultant (KAM) – Algérie",cards:"Cartes",traps:"Pièges",facts:"Chiffres clés",all:"Toutes les catégories",onlyko:"À revoir",tap:"Touchez pour voir la réponse",tapb:"Touchez pour revoir la question",know:"Je sais ✓",again:"À revoir ✗",known:"maîtrisées",tore:"à revoir",trapL:"Le piège",goodL:"La bonne réponse",prev:"‹ Préc.",next:"Suiv. ›",doneT:"Série terminée !",doneP:"Bravo. Recommencez ou travaillez seulement les cartes à revoir.",restart:"Recommencer",redo:"Revoir les ✗",reset:"Remettre la progression à zéro",empty:"Aucune carte à revoir ici. Bien joué !",trap:"Question piège",fact:"Chiffres clés"},
en:{title:"Snibe interview",sub:"Sales Consultant (KAM) – Algeria",cards:"Cards",traps:"Traps",facts:"Key facts",all:"All categories",onlyko:"To review",tap:"Tap to see the answer",tapb:"Tap to see the question again",know:"I know ✓",again:"Review ✗",known:"mastered",tore:"to review",trapL:"The trap",goodL:"The right answer",prev:"‹ Prev",next:"Next ›",doneT:"Set complete!",doneP:"Well done. Start again or work only on the cards to review.",restart:"Start again",redo:"Review the ✗",reset:"Reset progress",empty:"No cards to review here. Well done!",trap:"Trap question",fact:"Key facts"}};
let st={lang:"fr",mode:"cards",cat:"all",onlyko:false,idx:0,flip:false,marks:{},order:null};
try{Object.assign(st,JSON.parse(localStorage.getItem("snibe_fc")||"{}"));}catch(e){}
st.idx=0;st.flip=false;st.order=null;
const save=()=>{try{localStorage.setItem("snibe_fc",JSON.stringify({lang:st.lang,marks:st.marks,mode:st.mode}))}catch(e){}};
const t=k=>T[st.lang][k];
const pool=()=>DATA[st.mode].filter(c=>st.mode!=="cards"||st.cat==="all"||c.cat===st.cat);
function list(){let p=pool();if(st.onlyko)p=p.filter(c=>st.marks[c.id]==="ko");if(st.order){const o=st.order.filter(id=>p.some(c=>c.id===id));p=o.map(id=>p.find(c=>c.id===id));}return p}
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
function render(){
 document.documentElement.lang=st.lang;
 document.getElementById("title").innerHTML=t("title")+"<small>"+t("sub")+"</small>";
 document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===st.lang));
 document.querySelectorAll(".tabs button").forEach(b=>{b.textContent=t(b.dataset.m);b.classList.toggle("on",b.dataset.m===st.mode)});
 const sel=document.getElementById("cat");sel.style.display=st.mode==="cards"?"":"none";
 const cats=[...new Set(DATA.cards.map(c=>c.cat))];
 sel.innerHTML=`<option value="all">${t("all")}</option>`+cats.map(c=>`<option value="${c}">${DATA.catnames[c][st.lang]}</option>`).join("");sel.value=st.cat;
 const ok=document.getElementById("onlyko");ok.textContent="✗ "+t("onlyko");ok.classList.toggle("on",st.onlyko);
 document.getElementById("reset").textContent=t("reset");
 const p=pool(),k=p.filter(c=>st.marks[c.id]==="ok").length,r=p.filter(c=>st.marks[c.id]==="ko").length;
 document.getElementById("pbar").style.width=(p.length?k/p.length*100:0)+"%";
 document.getElementById("s1").textContent=`${k} / ${p.length} ${t("known")}`;document.getElementById("s2").textContent=`${r} ${t("tore")}`;
 const L=list(),stg=document.getElementById("stage");
 if(!L.length){stg.innerHTML=`<div class="done"><p>${t("empty")}</p></div>`;return}
 if(st.idx>=L.length){stg.innerHTML=`<div class="done"><h2>${t("doneT")}</h2><p>${t("doneP")}</p><button id="rs">${t("restart")}</button>${r?`<button id="rk">${t("redo")}</button>`:""}</div>`;
  document.getElementById("rs").onclick=()=>{st.idx=0;st.onlyko=false;render()};const rk=document.getElementById("rk");if(rk)rk.onclick=()=>{st.idx=0;st.onlyko=true;render()};return}
 const c=L[st.idx],l=st.lang,tag=st.mode==="cards"?DATA.catnames[c.cat][l]:t(st.mode==="traps"?"trap":"fact");
 let front,back;
 if(st.mode==="cards"){front=c.q[l];back=`<div class="a">${esc(c.a[l])}</div>`}
 else if(st.mode==="traps"){front=c.q[l];back=`<div class="trap"><b>${t("trapL")}</b>${esc(c.trap[l])}</div><div class="good"><b>${t("goodL")}</b>${esc(c.a[l])}</div>`}
 else{front=c.q[l];back=`<ul class="facts">${c.a[l].split(" · ").map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`}
 const m=st.marks[c.id];
 stg.innerHTML=`<div class="scene"><div class="card ${st.flip?"flip":""}" id="cd"><div class="face"><span class="tag">${tag}${m?(m==="ok"?" · ✓":" · ✗"):""}</span><div class="q">${esc(front)}</div><div class="hint">${t("tap")}</div></div><div class="face back"><span class="tag">${tag}</span>${back}<div class="hint">${t("tapb")}</div></div></div></div>
 <div class="act"><button class="ko" id="bko">${t("again")}</button><button class="ok" id="bok">${t("know")}</button></div>
 <div class="nav"><button id="pv">${t("prev")}</button><span>${st.idx+1} / ${L.length}</span><button id="nx">${t("next")}</button></div>`;
 const cd=document.getElementById("cd");cd.onclick=()=>{st.flip=!st.flip;cd.classList.toggle("flip",st.flip)};
 const fit=()=>{const f=cd.querySelectorAll(".face");let h=340;f.forEach(x=>{x.style.position="relative";h=Math.max(h,x.scrollHeight);x.style.position=""});cd.style.minHeight=h+"px";cd.parentNode.style.minHeight=h+"px"};fit();
 const mark=v=>{st.marks[c.id]=v;save();st.idx++;st.flip=false;render()};
 document.getElementById("bok").onclick=()=>mark("ok");document.getElementById("bko").onclick=()=>mark("ko");
 document.getElementById("pv").onclick=()=>{if(st.idx>0){st.idx--;st.flip=false;render()}};
 document.getElementById("nx").onclick=()=>{st.idx++;st.flip=false;render()};
}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{st.lang=b.dataset.l;save();render()});
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{st.mode=b.dataset.m;st.idx=0;st.flip=false;st.order=null;st.onlyko=false;save();render()});
document.getElementById("cat").onchange=e=>{st.cat=e.target.value;st.idx=0;st.flip=false;st.order=null;render()};
document.getElementById("onlyko").onclick=()=>{st.onlyko=!st.onlyko;st.idx=0;st.flip=false;render()};
document.getElementById("shuf").onclick=()=>{const ids=pool().map(c=>c.id);for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}st.order=ids;st.idx=0;st.flip=false;render()};
document.getElementById("reset").onclick=()=>{st.marks={};save();st.idx=0;st.flip=false;render()};
document.addEventListener("keydown",e=>{if(e.key===" "){e.preventDefault();document.getElementById("cd")?.click()}if(e.key==="ArrowRight")document.getElementById("nx")?.click();if(e.key==="ArrowLeft")document.getElementById("pv")?.click()});
render();
</script></body></html>
